<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validação de Certificados | Mobilizadores Gemini</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Google Sans', Arial, sans-serif; }
    body { background-color: #f8f9fa; color: #202124; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .card { 
      background: #ffffff; 
      border-radius: 16px; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
      width: 100%; 
      max-width: 480px; 
      text-align: center; 
      border: 1px solid #e0e0e0; 
      overflow: hidden; 
    }

    .banner-container {
      width: 100%;
      background-color: #000000;
      line-height: 0;
    }

    .banner-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .card-body {
      padding: 28px 32px 32px 32px;
    }

    h1 { font-size: 22px; color: #1a73e8; margin: 0 0 6px 0; }
    p.sub { font-size: 14px; color: #5f6368; margin: 0 0 24px 0; }
    
    .input-group { display: flex; gap: 8px; margin-bottom: 20px; }
    input { flex: 1; padding: 12px 16px; border: 1.5px solid #dadce0; border-radius: 8px; font-size: 15px; outline: none; text-transform: uppercase; }
    input:focus { border-color: #1a73e8; }
    button { background: #1a73e8; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 500; cursor: pointer; transition: background 0.2s; font-size: 15px; }
    button:hover { background: #1557b0; }
    
    .result { display: none; text-align: left; margin-top: 24px; padding: 20px; border-radius: 8px; background-color: #f1f8e9; border: 1px solid #c8e6c9; }
    .result.error { background-color: #fde8e8; border-color: #f8b4b4; }
    .badge { display: inline-block; background: #34a853; color: white; padding: 4px 12px; border-radius: 50px; font-size: 12px; font-weight: bold; margin-bottom: 12px; }
    .badge.error { background: #ea4335; }
    
    .info-line { margin: 8px 0; font-size: 14px; color: #3c4043; }
    .info-line strong { color: #202124; }
    
    .spinner { display: none; margin: 15px auto; border: 3px solid #f3f3f3; border-top: 3px solid #1a73e8; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="card">
    <!-- Banner Oficial -->
    <div class="banner-container">
      <img src="https://lh3.googleusercontent.com/d/1Qof21HuSNFWbbv0mV8Zf3-S_mp-54a3n" alt="Mobilizadores Gemini" class="banner-img">
    </div>

    <!-- Conteúdo Principal -->
    <div class="card-body">
      <h1>Verificação de Autenticidade</h1>
      <p class="sub">Mobilizadores Gemini / Equipe Savio Ferraz</p>

      <div class="input-group">
        <input type="text" id="codigoInput" placeholder="Ex: GEM-8SF5QA" maxlength="12">
        <button onclick="validarCertificado()">Validar</button>
      </div>

      <div class="spinner" id="loader"></div>

      <div id="resultado" class="result">
        <span id="badgeStatus" class="badge"></span>
        <div class="info-line"><strong>Participante:</strong> <span id="resNome"></span></div>
        <div class="info-line"><strong>Evento:</strong> <span id="resEvento"></span></div>
        <div class="info-line"><strong>Data de Emissão:</strong> <span id="resData"></span></div>
        <div class="info-line"><strong>Código:</strong> <span id="resCodigo"></span></div>
      </div>
    </div>
  </div>

  <script>
    // URL oficial da API do Apps Script
    const API_URL = "https://script.google.com/macros/s/AKfycbwoMvzMu94SpMnQyciK8attZyATZIjZ3ikThd9YfdXBJWA3nClxCzurNpvW1WaOySQd/exec";

    async function validarCertificado() {
      const codigo = document.getElementById('codigoInput').value.trim();
      const loader = document.getElementById('loader');
      const resultado = document.getElementById('resultado');
      const badge = document.getElementById('badgeStatus');

      if (!codigo) {
        alert("Por favor, digite o código de validação.");
        return;
      }

      loader.style.display = 'block';
      resultado.style.display = 'none';

      try {
        const response = await fetch(`${API_URL}?codigo=${encodeURIComponent(codigo)}`);
        const data = await response.json();

        loader.style.display = 'none';
        resultado.style.display = 'block';

        if (data.sucesso) {
          resultado.className = "result";
          badge.className = "badge";
          badge.innerText = "CERTIFICADO AUTÊNTICO";
          
          document.getElementById('resNome').innerText = data.nome;
          document.getElementById('resEvento').innerText = data.evento;
          document.getElementById('resData').innerText = data.dataEmissao;
          document.getElementById('resCodigo').innerText = data.codigo;
        } else {
          resultado.className = "result error";
          badge.className = "badge error";
          badge.innerText = "CÓDIGO INVÁLIDO";
          
          document.getElementById('resNome').innerText = "-";
          document.getElementById('resEvento').innerText = "-";
          document.getElementById('resData').innerText = "-";
          document.getElementById('resCodigo').innerText = codigo;
        }
      } catch (err) {
        loader.style.display = 'none';
        alert("Erro ao consultar a base de dados. Tente novamente.");
      }
    }
  </script>

</body>
</html>
